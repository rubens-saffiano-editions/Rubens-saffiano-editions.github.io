<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ruben's Saffiano</title>
<meta name="description" content="Ruben's Saffiano — joaillerie fine, création maison et maroquinerie. Catalogues privés et commande personnelle sur WhatsApp.">
<meta name="theme-color" content="#ffffff">
<style>
/* Mise en page : corps noir (hero + bande « sur mesure »), menu et pied de page blancs.
   Texte toujours franc : noir pur sur blanc, blanc pur sur noir. Une seule famille sans empattement. */
:root{
  --noir:#050505;
  --blanc:#FFFFFF;
  --encre:#000000;            /* texte sur blanc */
  --gris:#000000;             /* secondaire sur blanc : noir franc */
  --gris-clair:#FFFFFF;       /* secondaire sur noir : blanc franc */
  --filet:rgba(0,0,0,.12);    /* filet sur blanc */
  --filet-nuit:rgba(255,255,255,.22);
  --f:'Helvetica Neue',Helvetica,Arial,sans-serif;
  --gouttiere:clamp(16px,4.5vw,56px);
  --entete:50px;
  --ease:cubic-bezier(.22,.61,.36,1);
  color-scheme:dark;
  background:var(--noir);
}
*,*::before,*::after{box-sizing:border-box}
html{background:#fff;scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--blanc);color:var(--blanc);font-family:var(--f);font-weight:400;font-size:12px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.fige{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:1px solid currentColor;outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;flex:none}
.surtitre{font-weight:400;font-size:9px;letter-spacing:.3em;text-transform:uppercase}

/* ——— En-tête ——— */
.entete,.site-header{height:50px !important;min-height:50px !important;max-height:50px !important;display:flex !important;flex-direction:row !important;flex-wrap:nowrap !important;align-items:center !important;justify-content:space-between !important;padding:0 16px !important;margin:0 !important;background-color:#ffffff !important;border-bottom:1px solid #e5e5e5 !important;box-sizing:border-box !important;width:100% !important;position:sticky !important;top:0 !important;z-index:1000 !important;color:#000}
.entete.scrolled,.site-header.scrolled{background-color:#ffffff !important}
.bloc-g,.bloc-d{display:flex !important;flex-direction:row !important;flex-wrap:nowrap !important;align-items:center !important;gap:12px;flex-shrink:0 !important;margin:0;width:auto !important}
.entete .bloc-d{margin-left:auto}
.entete svg.ic{width:22px !important;height:22px !important;stroke-width:2.3px !important;stroke:#000000 !important;fill:none !important;stroke-linecap:round;stroke-linejoin:round}
.icone-btn{appearance:none;background:none;border:0;padding:0;margin:0;cursor:pointer;width:22px;height:50px;display:flex;align-items:center;justify-content:center;flex:none;color:#000;transition:opacity .3s var(--ease)}
@media (hover:hover){.icone-btn:hover{opacity:.55}}
svg.ic{display:block !important;width:20px !important;height:20px !important;fill:none !important;stroke:#000000 !important;stroke-width:2 !important;stroke-linecap:round;stroke-linejoin:round;opacity:1 !important;visibility:visible !important;margin:0 !important;flex:none}
.marque{position:absolute;left:50%;transform:translateX(-50%);margin:0;white-space:nowrap;font-weight:400;font-size:13px;letter-spacing:.25em;padding-left:.25em;text-transform:uppercase;line-height:1;color:#000}
@media (max-width:374px){.entete .marque{font-size:10px;letter-spacing:.14em;padding-left:.14em}}

/* ——— Hero ——— */
main{padding-top:0;margin-top:0}
.hero{position:relative;margin-top:0;height:calc(100vh - 50px);height:calc(100svh - 50px);min-height:520px;max-height:1000px;overflow:hidden;background:var(--blanc);color:var(--blanc);isolation:isolate}
.diapo{position:absolute;inset:0;z-index:0;opacity:0;visibility:hidden;transition:opacity 0s .5s,visibility 0s .5s}
.diapo.active{z-index:1;opacity:1;visibility:visible;transition:opacity .5s ease-in-out,visibility 0s}
.fond{position:absolute;inset:0}
.fond img{width:100%;height:100%;object-fit:contain;object-position:var(--focus,50% 50%);image-rendering:auto;image-rendering:-webkit-optimize-contrast;-webkit-backface-visibility:hidden;backface-visibility:hidden;transform:translateZ(0)}
.fond.compose{background:
  radial-gradient(ellipse 70% 60% at var(--gx,50%) var(--gy,50%),rgba(229,228,226,.13),transparent 72%),
  repeating-linear-gradient(45deg,rgba(255,255,255,.02) 0 1px,transparent 1px 7px),
  repeating-linear-gradient(-45deg,rgba(0,0,0,.45) 0 1px,transparent 1px 7px),
  linear-gradient(180deg,#0a0a0a,#050505)}
.voile{display:none}
.diapo-texte{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:0 var(--gouttiere) 66px;display:grid;justify-items:center;gap:8px;text-align:center;color:var(--blanc);text-shadow:0 1px 10px rgba(0,0,0,.28)}
.diapo-titre{margin:0;font-weight:400;font-size:12.5px;letter-spacing:.26em;text-transform:uppercase;padding-left:.24em;white-space:nowrap}
.diapo-sous{margin:0;font-weight:300;font-size:11px;letter-spacing:.06em;white-space:nowrap}
.lien{display:inline-flex;align-items:center;min-height:40px;font-weight:300;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;padding-left:.14em;background:linear-gradient(currentColor,currentColor) .14em calc(100% - 9px)/calc(100% - .14em) 1px no-repeat;transition:background-size .5s var(--ease)}
.lien:hover{background-size:30% 1px}
.diapo-texte > *{opacity:0;transform:translateY(10px);transition:opacity 1s var(--ease),transform 1s var(--ease)}
.diapo.active .diapo-texte > *{opacity:1;transform:none}
.diapo.active .diapo-texte > *:nth-child(2){transition-delay:.12s}
.diapo.active .diapo-texte > *:nth-child(3){transition-delay:.22s}
.progression{position:absolute;z-index:2;left:var(--gouttiere);right:var(--gouttiere);bottom:14px;display:flex;gap:6px;max-width:420px;margin-inline:auto}
.trait{appearance:none;border:0;background:none;cursor:pointer;flex:1;padding:14px 0}
.trait span{display:block;height:2px;background:rgba(255,255,255,0.3);position:relative;overflow:hidden}
.trait span::after{content:"";position:absolute;top:0;left:0;bottom:0;width:0;background:#ffffff}
.trait.vu span::after{width:100%}
.trait.en-cours span::after{animation:fillBar var(--duree,2000ms) linear forwards}
@keyframes fillBar{from{width:0}to{width:100%}}
.hero.pause .trait.en-cours span::after{animation-play-state:paused}
@keyframes remplir{to{transform:scaleX(1)}}
/* Hero plein cadre (mobile) · image entière centrée (ordinateur) */
@media (max-width:899px){
  .fond img{object-fit:cover}
}
@media (min-width:900px){
  .fond img{object-fit:cover;object-position:var(--focus-pc,50% 50%)}
  .diapo-titre{font-size:14px}
}

/* ——— Tiroir : rubriques dépliables (niveaux de gamme et maisons) ——— */
.tiroir nav .rub{border-bottom:1px solid rgba(0,0,0,.08)}
.tiroir nav .rub-tete,.tiroir nav > a{appearance:none;background:none;border:0;width:100%;margin:0;padding:0;display:flex;align-items:center;justify-content:space-between;min-height:56px;line-height:1.4;font-family:var(--f);font-weight:300;font-size:11.5px;letter-spacing:.04em;color:var(--encre);text-align:left;cursor:pointer}
.tiroir nav .rub-tete .ico{transition:transform .35s ease}
.tiroir nav .rub.ouverte > .rub-tete .ico{transform:rotate(90deg)}
.pli{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s ease}
.ouverte > .pli{grid-template-rows:1fr}
.pli > div{overflow:hidden;min-height:0}
.gamme{border-top:1px solid #f0f0f0;margin-left:12px}
.gamme-tete{appearance:none;background:none;border:0;width:100%;margin:0;padding:0;min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;color:#000;font-family:var(--f);text-align:left}
.gamme-tete b{font-weight:700;font-size:12px;letter-spacing:1.5px;text-transform:uppercase}
.gamme-tete small{font-weight:300;font-size:11px;color:#888888;letter-spacing:.02em;margin-left:8px}
.gamme-tete svg{width:14px;height:14px;fill:none;stroke:#000;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none;transition:transform .35s ease}
.gamme.ouverte > .gamme-tete svg{transform:rotate(180deg)}
.maisons{list-style:none;margin:0;padding:0 0 8px}
.tiroir nav .maisons a{display:flex;align-items:center;justify-content:flex-start;gap:14px;min-height:44px;border:0;border-top:1px solid #f4f4f4;font-size:12.5px;letter-spacing:.02em}
.maisons .n{width:20px;flex:none;font-weight:300;font-size:11px;color:#888888;font-variant-numeric:tabular-nums}
.maisons .m{flex:1;font-weight:700;color:#000}
.maisons .act{flex:none;font-weight:400;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:#000;margin-right:-8px}
.tiroir nav .rub-tete small{margin-left:8px;font-size:10.5px;color:#888888;letter-spacing:.02em}
.tiroir nav .maisons .ico{width:13px;height:13px;stroke-width:1.6;margin-left:0}
@media (prefers-reduced-motion:reduce){.pli,.gamme-tete svg,.tiroir nav .rub-tete .ico{transition:none}}

/* ——— Sur mesure (bande noire) ——— */
.sur-mesure{position:relative;background:#fff;color:#000;margin-top:0;padding:clamp(56px,7vw,76px) var(--gouttiere);display:grid;justify-items:center;gap:20px;text-align:center}
.sceau{display:block;width:var(--t,96px);height:var(--t,96px);max-width:100%}
.diapo-texte .sceau{--t:clamp(118px,28vw,150px);margin-bottom:8px}
.sceau-img{width:var(--t,96px);height:auto;max-width:100%}
.sur-mesure .surtitre{color:#000;font-weight:700 !important;font-size:14px;letter-spacing:1.5px;text-transform:uppercase}
.sur-mesure blockquote{margin:0;max-width:30ch;font-weight:300;font-size:clamp(1rem,2.2vw,1.25rem);line-height:1.6;letter-spacing:.04em;text-wrap:balance}
.sur-mesure .trois-lignes{max-width:none;font-weight:300 !important;font-size:13px;color:#111111;line-height:1.6;letter-spacing:.01em}
.sur-mesure .trois-lignes span{display:block;white-space:nowrap}
.sur-mesure p{margin:0;max-width:52ch;font-weight:300;font-size:.84rem;letter-spacing:.02em;color:var(--gris-clair)}
.bouton{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:46px;padding:0 28px 0 calc(28px + .3em);margin-top:8px;border:1px solid currentColor;font-weight:500;font-size:9px;letter-spacing:.3em;text-transform:uppercase;transition:background-color .4s var(--ease),color .4s var(--ease)}
.sur-mesure .bouton{border:1px solid #000000;color:#000;background:#fff;font-weight:400}
.sur-mesure .bouton:hover{background:#000;color:#fff}

/* ——— Tiroir blanc ——— */
.ombre{position:fixed;inset:0;z-index:1040;background:rgba(0,0,0,.35);opacity:0;visibility:hidden;transition:opacity .45s var(--ease),visibility 0s .45s}
.ombre.ouvert{opacity:1;visibility:visible;transition:opacity .45s var(--ease)}
.tiroir{position:fixed;inset:0 auto 0 0;z-index:1041;width:min(480px,100%);background:var(--blanc);color:var(--encre);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);transform:translateX(-102%);transition:transform .55s var(--ease);display:flex;flex-direction:column}
.tiroir.ouvert{transform:none}
.tiroir-tete{height:50px;min-height:50px;flex:none;box-sizing:border-box;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #e5e5e5}
.tiroir-tete .icone-btn{color:var(--encre)}
.tiroir nav{overflow-y:auto;padding:14px var(--gouttiere) 40px;flex:1}
.tiroir nav > a{display:flex;align-items:center;justify-content:space-between;min-height:56px;line-height:1.4;font-weight:300;font-size:11.5px;letter-spacing:.04em;color:var(--encre);border-bottom:1px solid rgba(0,0,0,.08);transition:opacity .3s var(--ease)}
.tiroir nav a:hover{opacity:.55}
.tiroir nav .ico{width:16px;height:16px;stroke-width:1.9;flex:none;margin-left:16px}

/* ——— Recherche ——— */
.recherche{position:fixed;inset:0 0 auto 0;z-index:1042;background:var(--blanc);color:var(--encre);padding-top:env(safe-area-inset-top,0px);transform:translateY(-102%);transition:transform .5s var(--ease);max-height:100svh;display:flex;flex-direction:column;border-bottom:1px solid var(--filet)}
.recherche.ouvert{transform:none}
.recherche-ligne{display:flex;align-items:center;gap:8px;padding:10px calc(var(--gouttiere) - 10px) 10px var(--gouttiere);border-bottom:1px solid var(--encre)}
.recherche-ligne input{flex:1;min-width:0;border:0;background:none;outline:none;font-family:var(--f);font-weight:400;font-size:.92rem;padding:12px 0;color:var(--encre)}
.recherche-ligne input::placeholder{color:var(--gris)}
.resultats{list-style:none;margin:0;padding:8px var(--gouttiere) 24px;overflow-y:auto}
.resultats a{display:flex;justify-content:space-between;align-items:center;min-height:52px;border-bottom:1px solid var(--filet);font-weight:500;font-size:.82rem}
.resultats .ico{width:16px;height:16px;stroke-width:1.8}
.resultats .vide{padding:18px 0;color:var(--gris);font-size:.9rem}

/* ——— L'atelier & savoir-faire ——— */
.atelier{background:#f6f6f6;color:#000;border-bottom:1px solid #e5e5e5;display:grid;gap:22px;padding:24px 24px 48px}
.galerie{position:relative;width:100%;max-width:560px;margin-inline:auto;aspect-ratio:4 / 5 !important;overflow:hidden;background:#1a1a1a}
.galerie img{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:4 / 5 !important;object-fit:cover !important;width:100% !important;image-rendering:-webkit-optimize-contrast !important;image-rendering:crisp-edges !important;transform:translateZ(0) !important;-webkit-backface-visibility:hidden !important;backface-visibility:hidden !important;filter:contrast(1.02);z-index:0;opacity:0;visibility:hidden;transition:opacity 0s .5s,visibility 0s .5s}
.galerie img.active{z-index:1;opacity:1;visibility:visible;transition:opacity 0.5s ease-in-out !important}
.galerie-traits{position:absolute;z-index:2;left:var(--gouttiere);right:var(--gouttiere);bottom:10px;display:flex;gap:6px;max-width:420px;margin-inline:auto}
.galerie.pause .trait.en-cours span::after{animation-play-state:paused}
.atelier-texte{display:grid;justify-items:center;gap:0;text-align:center;padding-inline:var(--gouttiere)}
.atelier-titre{margin:0;font-weight:700 !important;font-size:14px;letter-spacing:1px;text-transform:uppercase}
.atelier .lien{font-size:11px;font-weight:700 !important;margin-top:12px;background:none;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px;min-height:auto}
.atelier-sous{margin:6px 0 0;font-weight:300 !important;font-size:13px;letter-spacing:.06em}
@media (min-width:900px){
  .atelier{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:clamp(32px,5vw,72px);padding:clamp(48px,6vw,80px) max(24px,calc((100% - 1180px) / 2))}
  .galerie{margin-right:0}
}

/* ——— Pied de page blanc ——— */
.pied{background:var(--blanc);color:var(--encre);border-top:1px solid var(--filet);padding-bottom:env(safe-area-inset-bottom,0px)}
.cercle{max-width:1180px;margin-inline:auto;padding:clamp(48px,7vw,80px) var(--gouttiere) 28px;display:grid;gap:14px}
.cercle h2{margin:0;font-weight:700 !important;font-size:14px;letter-spacing:1.5px;text-transform:uppercase}
.cercle p.intro{margin:0;max-width:56ch;font-weight:300 !important;font-size:13px;line-height:1.6;color:#111111}
.form-tel{display:grid;gap:14px;max-width:760px}
.champ{display:flex;align-items:center;border-bottom:1px solid var(--encre)}
.champ input{flex:1;min-width:0;border:0;background:none;outline:none;font-family:var(--f);font-weight:300;font-size:13px;padding:12px 0;color:var(--encre)}
.champ input::placeholder{color:var(--encre);opacity:1}
.champ .ico{width:24px;height:24px;stroke-width:1.6}
.consentement{margin:0;font-weight:300;font-size:11px;line-height:1.55;color:var(--encre);cursor:pointer}
.consentement input{appearance:none;width:16px;height:16px;margin:3px 0 0;border:1px solid var(--encre);display:grid;place-content:center;cursor:pointer}
.consentement input:checked{background:var(--encre)}
.consentement input:checked::after{content:"";width:7px;height:3.5px;border:solid var(--blanc);border-width:0 0 1.3px 1.3px;transform:rotate(-45deg) translate(1px,-1px)}
.consentement a{color:var(--encre);font-weight:400;border-bottom:1px solid var(--encre)}
.statut{margin:0;font-size:.78rem}
.statut:empty{display:none}
.statut.erreur{color:#9b2c1f}
.reseaux{display:flex;flex-wrap:nowrap;justify-content:center;gap:clamp(18px,6vw,36px);margin-top:4px}
.reseaux a{width:44px;height:44px;flex:none;display:grid;place-items:center;color:var(--encre);transition:opacity .3s var(--ease)}
.reseaux a:hover{opacity:.55}
.reseaux a[aria-disabled="true"]{cursor:default}
.reseaux svg{width:22px;height:22px;fill:currentColor;stroke:none}


.colonnes{border-top:1px solid var(--filet)}
.colonnes-in{max-width:1180px;margin-inline:auto}
.accordeon{border-bottom:1px solid var(--filet)}
.accordeon summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;min-height:56px;padding-inline:var(--gouttiere);font-weight:400;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.accordeon summary::-webkit-details-marker{display:none}
.accordeon summary .ico{width:16px;height:16px;stroke-width:1.5;transition:transform .4s var(--ease)}
.accordeon[open] summary .ico{transform:rotate(180deg)}
.accordeon ul{list-style:none;margin:0;padding:0 var(--gouttiere) 30px;display:grid;gap:16px}
.accordeon li{font-weight:300;font-size:11px;line-height:1.5;letter-spacing:.03em;color:var(--encre)}
.accordeon li a,.accordeon li button{transition:color .3s var(--ease)}
.accordeon li a:hover,.accordeon li button:hover{opacity:.55}
.accordeon li button{appearance:none;background:none;border:0;padding:0;cursor:pointer;color:var(--encre);text-align:left;font-weight:300;font-size:11px;letter-spacing:.03em}
.num{color:var(--encre);font-weight:300;font-variant-numeric:tabular-nums}
@media (min-width:900px){
  .colonnes-in{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px;padding-inline:var(--gouttiere)}
  .accordeon{border-bottom:0}
  .accordeon summary{min-height:auto;padding:40px 0 18px;pointer-events:none}
  .accordeon summary .ico{display:none}
  .accordeon ul{padding:0 0 40px}
}
.copyright{border-top:1px solid var(--filet);padding:26px calc(var(--gouttiere) + 52px) calc(30px + env(safe-area-inset-bottom,0px));text-align:center;font-weight:300;font-size:9px;letter-spacing:.16em;line-height:2;text-transform:uppercase;color:var(--encre)}
.copyright .barre{display:inline-block;margin-inline:.9em;opacity:.35}

/* ——— Mentions légales ——— */
dialog{border:0;padding:0;background:transparent;color:var(--encre);max-width:none;max-height:none}
dialog::backdrop{background:rgba(0,0,0,.4)}
.legal{width:min(680px,calc(100vw - 24px))}
.legal-in{position:relative;background:var(--blanc);padding:52px clamp(20px,5vw,48px) 36px;max-height:calc(100svh - 24px);overflow:auto}
.legal-in .fermer{position:absolute;right:10px;top:8px}
.legal-in h3{margin:0 0 4px;font-weight:400;font-size:.8rem;letter-spacing:.28em;text-transform:uppercase}
.legal-in h4{margin:24px 0 4px;font-weight:400;font-size:.68rem;letter-spacing:.2em;text-transform:uppercase}
.legal-in p{margin:0;font-size:.82rem;color:var(--encre);max-width:62ch}
.a-completer{color:#9b6a1f}

/* ——— WhatsApp flottant, discret ——— */
.flottant{position:fixed;right:clamp(14px,3vw,24px);bottom:calc(clamp(14px,3vw,24px) + env(safe-area-inset-bottom,0px));z-index:20;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--noir);color:var(--blanc);box-shadow:0 0 0 1px rgba(255,255,255,.18);transition:opacity .4s var(--ease),transform .4s var(--ease)}
.flottant .ico{width:20px;height:20px}
.flottant.cache{opacity:0;transform:translateY(10px);pointer-events:none}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{anim
